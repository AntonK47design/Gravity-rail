<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07090f" />
    <meta name="description" content="ORBITAL — build a machine, start it, and watch the energy sphere come alive. A 3D physics construction puzzle." />
    <title>ORBITAL</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%237ee8ff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #07090f; overflow: hidden; }
      #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(ellipse at 50% 55%, #141c30 0%, #07090f 70%); z-index: 10; transition: opacity .6s ease; font-family: system-ui, sans-serif; }
      #loader.done { opacity: 0; pointer-events: none; }
      .ld-orbit { position: relative; width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(126,232,255,.18); }
      .ld-orbit::after { content: ''; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #dffbff;
        box-shadow: 0 0 18px 4px rgba(126,232,255,.8); top: -8px; left: 25px; transform-origin: 7px 39px; animation: ld 1.1s linear infinite; }
      @keyframes ld { to { transform: rotate(360deg); } }
      .ld-t { color: #9fb3d8; letter-spacing: .5em; font-size: 12px; font-weight: 700; padding-left: .5em; }
      .ld-err { color: #f8b4b4; text-align: center; line-height: 1.6; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="c" tabindex="0"></canvas>
      <div id="ui"></div>
    </div>
    <div id="loader"><div class="ld-orbit"></div><div class="ld-t">ORBITAL</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
